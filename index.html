<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<title>SnakeNest</title>
<meta name="description" content="SnakeNest — משחק סגירת שטחים עם נחשים: סוגרים שטחים, נזהרים מהיצורים ונלחמים בנחש המחשב.">
<meta property="og:title" content="SnakeNest · AppNest">
<meta property="og:description" content="סוגרים שטחים · שומרים על הזנב · קרב נחשים נגד המחשב">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{--bg:#0b0b0d;--bg2:#141418;--card:#17171c;--line:#3a3220;--acc:#d4af37;--acc2:#f3d77a;--txt:#f3efe4;--mut:#a29c8c;--ok:#4fd27b;--bad:#ff5d6c;--rad:16px}
body.th-emerald{--bg:#07110d;--bg2:#0d1b15;--card:#10211a;--line:#1f4a37;--acc:#3ddc97;--acc2:#a8f3cf;--txt:#eafaf2;--mut:#8fb5a3}
body.th-ocean{--bg:#061020;--bg2:#0b1a30;--card:#0f2038;--line:#1f3d66;--acc:#4cc3ff;--acc2:#b4e6ff;--txt:#eaf6ff;--mut:#8aa8c4}
body.th-ruby{--bg:#12070a;--bg2:#1d0c11;--card:#231017;--line:#56202f;--acc:#ff5a7a;--acc2:#ffb3c2;--txt:#fff0f3;--mut:#c49aa4}
body.th-day{--bg:#f6f1e6;--bg2:#ece5d4;--card:#fffdf8;--line:#d8c9a4;--acc:#9a7414;--acc2:#6d520c;--txt:#1d1a14;--mut:#6f6754}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Rubik,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);animation:fin .22s ease}
.screen.on{display:flex}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);background:var(--bg2)}
.top h2{flex:1;margin:0;font-size:19px;font-weight:700}
.bk{border:1px solid var(--acc);background:transparent;border-radius:12px;padding:8px 12px;font-weight:700;color:var(--acc);white-space:nowrap}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;display:grid;place-items:center}
.body{flex:1;overflow:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:14px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-weight:700;font-size:17px}
.btn.pri{background:var(--acc);color:#111;border-color:var(--acc)}
body.th-day .btn.pri{color:#fff}
.btn.sm{padding:10px;font-size:15px;width:auto}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center}
.mut{color:var(--mut);font-size:14px}
/* home */
#home{background:#05070a url(img/home-bg.jpg) center top/cover no-repeat}
#homeCv{display:none}
#homeCv{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hwrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 25%,rgba(0,0,0,.35) 45%,rgba(0,0,0,.6))}
body.th-day .hwrap{background:linear-gradient(180deg,rgba(246,241,230,.85),rgba(246,241,230,.35) 40%,rgba(246,241,230,.9))}
.htop{display:flex;justify-content:space-between;gap:8px}
.htop .grp{display:flex;gap:8px}
.logo{text-align:center;margin:22vh 0 1.5vh}
.logo h1{margin:0;font-size:46px;letter-spacing:.5px;font-weight:900;background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(0,0,0,.6))}
.logo p{margin:6px 0 0;color:var(--txt);opacity:.85;font-size:15px}
.menu{display:grid;gap:9px;margin-bottom:auto;max-width:460px;width:100%;align-self:center}
.mb{display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:18px;border:1px solid var(--acc);background:rgba(10,10,14,.72);backdrop-filter:blur(4px);font-size:19px;font-weight:800;text-align:start}
body.th-day .mb{background:rgba(255,253,248,.85)}
.mb.pri{background:var(--acc);color:#111}
body.th-day .mb.pri{color:#fff}
.mb .em{font-size:28px;width:36px;text-align:center}
.mb small{display:block;font-size:12.5px;font-weight:500;opacity:.8;margin-top:2px}
.badge{text-align:center;font-size:12px;color:var(--mut);margin-top:10px}
.badge b{color:var(--acc)}
/* levels */
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lt{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px;position:relative}
.lt.open{border-color:var(--acc)}
.lt .st{font-size:11px;color:var(--acc);letter-spacing:-1px;height:13px}
.lt.lock{opacity:.4}
.lt .rv{position:absolute;top:3px;inset-inline-end:5px;font-size:12px}
/* duel */
.bots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.bot{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:start}
.bot.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.bot b{font-size:17px;display:block}
.bot span{font-size:12.5px;color:var(--mut)}
/* skins */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sk{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px;text-align:center}
.sk canvas{width:100%;height:70px;display:block}
.sk.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.sk.lock{opacity:.55}
.sk b{display:block;margin:4px 0}
/* game */
#game{background:#05101a}
.hud{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:rgba(0,0,0,.35)}
.hud .ib{width:42px;height:42px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:#fff}
.hmid{flex:1;min-width:0}
.hl{display:flex;justify-content:space-between;font-size:13px;color:#d9e6f2;font-weight:700;gap:6px}
.hearts{letter-spacing:1px;white-space:nowrap}
.bar{position:relative;height:12px;border-radius:7px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:7px;transition:width .35s}
.bar .p1{background:linear-gradient(90deg,#38c172,#9ff0b8)}
.bar .p2{background:linear-gradient(90deg,#a855f7,#e2b4ff)}
.bar .tg{position:absolute;inset-block:-2px;width:2px;background:#fff;opacity:.9}
.bar.duo{display:flex}
#stage{flex:1;position:relative;touch-action:none;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;font-size:17px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:5;border:1px solid rgba(255,255,255,.2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.hint{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#fff;font-weight:800;font-size:18px;text-shadow:0 2px 6px #000;pointer-events:none;animation:pulse 1.4s infinite}
.hint small{display:block;font-weight:500;font-size:13px;opacity:.85}
@keyframes pulse{50%{opacity:.55}}
.pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,56px);gap:6px;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.35)}
body.pad-on .pad{display:grid}
.pad button{border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:24px;touch-action:none}
.pad button:active{background:rgba(255,255,255,.25)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px;animation:fin .2s}
.md{background:var(--card);border:1px solid var(--acc);border-radius:20px;padding:18px;width:100%;max-width:400px;max-height:88vh;overflow:auto;text-align:center}
.md h3{margin:4px 0 10px;font-size:24px}
.md .stars{font-size:38px;color:var(--acc);letter-spacing:4px;margin:4px 0}
.md .stars .off{opacity:.2}
.md .btns{display:grid;gap:9px;margin-top:14px}
.stat{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:15px}
.tut .ill{font-size:64px;margin:6px 0}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
/* settings */
.fld{margin-bottom:14px}
.fld label{display:block;font-weight:700;margin-bottom:7px}
.fld input,.fld select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-weight:600}
.chip.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tg2{width:54px;height:30px;border-radius:15px;background:var(--line);position:relative;border:0}
.tg2::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg2.on{background:var(--acc)}
.tg2.on::after{inset-inline-start:27px}
.rules p{line-height:1.6;margin:0 0 10px}
.rules .ic{font-size:22px;margin-inline-end:6px}
.snack{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:12px;z-index:90;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.snack.on{opacity:1}
.abicon{width:84px;height:84px;border-radius:22px;display:block;margin:4px auto 8px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv span:first-child{color:var(--mut)}

/* world map */
#levels{background:#140d07 url(img/map-bg.jpg) center/cover no-repeat}
.body.map{background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15) 30%,rgba(0,0,0,.45));padding:12px}
.world{margin-bottom:22px}
.wban{border-radius:18px;border:1px solid var(--acc);min-height:150px;background:#2a1d10 center/cover;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.wban>div{width:100%;padding:14px;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0));color:#fff}
.wban small{display:block;color:var(--acc2);font-weight:700;letter-spacing:.5px}
.wban b{display:block;font-size:24px}
.wban span{font-size:13px;opacity:.85}
.path{position:relative;height:850px}
.pline{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pline polyline{fill:none;stroke:#c9a35c;stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.7}
.node{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center}
.node .nb{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;color:#2a1a08;background:radial-gradient(circle at 35% 30%,#ffe9a8,#d4a43a);border:3px solid #6b4a1c;box-shadow:0 4px 10px rgba(0,0,0,.5);background-size:cover;background-position:center}
.node.done .nb{border-color:var(--acc);color:#fff;text-shadow:0 1px 4px #000}
.node.boss .nb{width:86px;height:86px;background:radial-gradient(circle at 35% 30%,#ff9a7a,#8e1f1f);border-color:#ffd24a}
.node.boss.done .nb{background-size:cover}
.node.lock .nb{filter:grayscale(1) brightness(.55)}
.node.cur .nb{animation:bob 1.2s ease-in-out infinite;box-shadow:0 0 0 4px rgba(255,215,90,.6),0 4px 14px rgba(0,0,0,.6)}
@keyframes bob{50%{transform:translateY(-6px)}}
.node .st{font-size:14px;color:#ffd24a;text-shadow:0 1px 3px #000;margin-top:2px;min-height:16px;letter-spacing:-1px}
.node .st em{font-style:normal;opacity:.25}
.cob{display:block;width:64px;height:64px}
/* gallery */
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gi{aspect-ratio:30/56;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi.lock span{font-size:34px;font-weight:900;color:var(--mut)}
.gi.lock small{font-size:11px;color:var(--mut);padding:0 4px;text-align:center}
.md.gview{padding:10px}

#pad{direction:ltr}
.world.wlock .wban{filter:grayscale(.7) brightness(.55)}
.wban{background-position:center 30%}

.shoot{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(0,0,0,.55));font-size:34px;display:none;place-items:center;z-index:6;touch-action:none;box-shadow:0 4px 16px rgba(0,0,0,.6)}
.shoot.on{display:grid;animation:pop .25s}
.shoot b{position:absolute;top:-6px;right:-6px;background:#111;color:#fff;border:2px solid #fff;border-radius:999px;min-width:26px;height:26px;font-size:15px;display:grid;place-items:center;padding:0 5px}
.shoot.am-venom{border-color:#8dff5a;box-shadow:0 0 18px #3fd33f}
.shoot.am-fire{border-color:#ff8a2a;box-shadow:0 0 18px #ff5a10}
.shoot.am-ice{border-color:#bdf0ff;box-shadow:0 0 18px #5ec8ff}
.shoot.am-bolt{border-color:#ffe14d;box-shadow:0 0 18px #ffd000}
body.pad-on .shoot{display:none!important}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
#padFire:disabled{opacity:.35}

.shoot img{width:52px;height:52px;pointer-events:none}

.ncode{font-size:40px;font-weight:900;letter-spacing:8px;color:var(--acc);margin:4px 0}
.seat{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.seat b{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:#666;display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.voice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.voice button{padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;touch-action:none}
.voice button.dn,#gTalk.dn{background:var(--acc);color:#111;border-color:var(--acc)}
.netwait{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:18px;z-index:7;text-align:center;padding:20px}
.btn:disabled{opacity:.4}

.bar.swap .p1{background:linear-gradient(90deg,#a855f7,#e2b4ff)}
.bar.swap .p2{background:linear-gradient(90deg,#38c172,#9ff0b8)}

.mrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mrow .mb{font-size:16px;padding:10px 12px;gap:8px}
.mrow .mb .em{font-size:22px;width:26px}
.coinbar{display:flex;align-items:center;gap:10px;font-size:26px}
.coinbar b{color:var(--acc)}
.coinbar .mut{font-size:14px}
.upg,.achc{display:flex;align-items:center;gap:12px}
.uic{font-size:30px;width:42px;text-align:center}
.ubody{flex:1;display:flex;flex-direction:column;gap:3px}
.udots{display:flex;gap:5px;margin-top:4px}
.udots i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.udots i.on{background:var(--acc)}
.umax{color:var(--ok);font-weight:800}
.abar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.abar i{display:block;height:100%;background:var(--acc)}
.arew{font-weight:800;color:var(--acc);white-space:nowrap}
.achc.ok{border-color:var(--acc)}
.achc:not(.ok) .uic{filter:grayscale(.8);opacity:.7}

.wpn{position:absolute;left:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:70px;height:70px;border-radius:50%;border:3px solid #ffb347;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(0,0,0,.6));display:none;place-items:center;z-index:6;touch-action:none;box-shadow:0 0 16px rgba(255,140,40,.7)}
.wpn.on{display:grid;animation:pop .25s}
.wpn img{width:50px;height:50px;pointer-events:none}
.wpn b{position:absolute;top:-6px;left:-6px;background:#111;color:#fff;border:2px solid #ffb347;border-radius:999px;min-width:26px;height:26px;font-size:15px;display:grid;place-items:center;padding:0 5px}
.wpn.empty{opacity:.35;filter:grayscale(1)}
.wpn.cd img{opacity:.45}
.wpn.act{border-color:#8fe3ff;box-shadow:0 0 26px #5ec8ff,0 0 8px #fff inset;animation:wpnPulse .5s infinite alternate}
@keyframes wpnPulse{to{transform:scale(1.08)}}
body.pad-on .wpn{display:none!important}
#padWpn:disabled{opacity:.35}
.wcard .wic{width:56px;height:56px;flex:none;object-fit:contain}
.wcard .wbtns{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.wcard.eq{outline:2px solid var(--acc,#ffb347)}
</style>
</head>
<body>
<section class="screen on" id="home">
  <canvas id="homeCv"></canvas>
  <div class="hwrap">
    <div class="htop">
      <div class="grp"><button class="ib" id="hTheme" aria-label="theme">◐</button><button class="ib" id="hSet" aria-label="settings">⚙️</button></div>
      <div class="grp"><button class="ib" data-go="rules" aria-label="how to play">❓</button><button class="ib" id="hAbout" aria-label="about">ℹ️</button></div>
    </div>
    <div class="logo"><h1>SnakeNest</h1><p data-t="tagline"></p></div>
    <div class="menu">
      <button class="mb pri" data-go="levels"><span class="em">🐍</span><span><span data-t="play_levels"></span><small id="hLvSub"></small></span></button>
      <button class="mb" data-go="duel"><span class="em">⚔️</span><span><span data-t="play_duel"></span><small id="hDuelSub"></small></span></button>
      <button class="mb" data-go="online"><span class="em">🌐</span><span><span data-t="play_online"></span><small id="hOnSub"></small></span></button>
      <button class="mb" data-go="daily"><span class="em">📅</span><span><span data-t="play_daily"></span><small id="hDailySub"></small></span></button>
      <div class="mrow"><button class="mb" data-go="gallery"><span class="em">🖼️</span><span><span data-t="gallery"></span><small id="hGalSub"></small></span></button><button class="mb" data-go="skins"><span class="em">🎨</span><span><span data-t="skins"></span><small id="hSkinSub"></small></span></button></div>
      <div class="mrow"><button class="mb" data-go="shop"><span class="em">🛒</span><span><span data-t="sh_title"></span><small id="hShopSub"></small></span></button><button class="mb" data-go="ach"><span class="em">🏆</span><span><span data-t="ach_title"></span><small id="hAchSub"></small></span></button></div>

    </div>
    <div class="badge">AppNest · <b>SnakeNest</b> · v<span class="ver"></span></div>
  </div>
</section>

<script>/* =====================================================================
   NestLink 1.1 — AppNest online multiplayer module (WebRTC via PeerJS)
   One file, drop into any AppNest game. No server of our own:
   - a public PeerJS server only introduces the phones; game data, voice
     and voice messages then travel directly phone-to-phone.
   - star layout: the host is seat 0 and relays messages between guests,
     so 2–6 players work; voice is a direct mesh (good up to ~4–5).
   - every game message is sequenced and re-sent after a reconnect.
   The game owns the session object (persist it with the game state) and
   receives events through callbacks. See NESTLINK.md for the API.
   1.1: sendTo(seat, d) — a private message to one seat only (card games:
        the host deals each player only their own cards). Compatible with 1.0.
        Heartbeat: a phone that vanished (app closed, no signal) is marked offline
        within ~10 s instead of looking connected forever.
        After a reconnect, if the other side already got more messages than we
        remember sending (we restored an older saved session), numbering continues
        after theirs instead of being silently ignored.
   ===================================================================== */
const NestLink = (() => {
  const CDNS = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'];
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  const AB = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const genCode = (n = 5) => Array.from({ length: n }, () => AB[Math.floor(Math.random() * AB.length)]).join('');
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function loadScript(u) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(rej, 12000); }); }
  async function loadPeer() { if (window.Peer) return true; for (const u of CDNS) { try { await loadScript(u); if (window.Peer) return true; } catch (e) {} } return false; }
  const b64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

  function create(opt) {
    const L = { status: 'off', lastErr: null, peer: null, conns: {}, retry: null, chunks: {}, calls: {}, audio: {}, mic: null, talking: false, openMic: false, rec: null, seen: {}, hb: {}, hbT: null };
    let S = null;                                         // the session — owned and persisted by the game
    const ev = (k, ...a) => { try { opt[k] && opt[k](...a); } catch (e) { console.error(e); } };
    const persist = () => ev('persist', S);
    const roomId = c => (opt.app || 'nest') + '-v1-' + c.toLowerCase();
    const max = () => opt.maxPlayers || 2;
    const isHost = () => S && S.role === 'host';
    function peerOpts() {
      const q = new URLSearchParams(location.search), o = { debug: 0, config: { iceServers: opt.iceServers || ICE } };
      if (q.get('peerhost')) { o.host = q.get('peerhost'); o.port = +(q.get('peerport') || 9000); o.path = '/'; o.secure = false; }   // test servers only
      return o;
    }
    function setStatus(st, err) { L.status = st; if (err !== undefined) L.lastErr = err; ev('onStatus', st, L.lastErr); }
    const link = seat => S.links[seat] || (S.links[seat] = { seq: 0, lastIn: 0, out: [] });
    const rosterEntry = seat => S.roster.find(p => p.seat === seat);
    function rawTo(seat, m) { const c = L.conns[seat]; try { if (c && c.open) c.send(m); } catch (e) {} }
    function rawAll(m, except) { for (const s in L.conns) if (+s !== except) rawTo(+s, m); }

    /* ---------- starting ---------- */
    async function start(session) {
      close(true); S = session; persist();
      L.hbT = setInterval(beat, 3000);                   // after close(), which clears it
      setStatus('connecting');
      if (!(await loadPeer())) { setStatus('error', 'load'); return false; }
      const peer = L.peer = new Peer(isHost() ? roomId(S.code) : undefined, peerOpts());
      peer.on('open', id => {
        S.pid = id; if (isHost()) { const me = rosterEntry(0); if (me) { me.pid = id; me.online = true; } }
        persist(); setStatus(isHost() ? 'waiting' : 'connecting'); if (!isHost()) connectHost();
      });
      peer.on('connection', c => { if (isHost()) attach(c, null); });
      peer.on('call', onCall);
      peer.on('disconnected', () => setTimeout(() => { try { if (L.peer === peer && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500));
      peer.on('error', e => {
        const t = e && e.type;
        if (t === 'unavailable-id') {                     // room id still held (e.g. after reload) — new code while nobody joined, else retry
          if (S.roster.length < 2) { S.code = genCode(); persist(); ev('onCode', S.code); }
          setTimeout(() => start(S), S.roster.length < 2 ? 300 : 4000); return;
        }
        if (t === 'peer-unavailable') { setStatus('notfound', 'nf'); scheduleRetry(); return; }
        if (/network|server-error|socket/.test(t || '')) setStatus('error', 'net');
      });
      return true;
    }
    function host(code) {
      return start({ role: 'host', code: code || genCode(), seat: 0, cid: uid(), roster: [{ seat: 0, name: opt.name ? opt.name() : '', online: true, cid: null, voice: false }], links: {} });
    }
    function join(code) { return start({ role: 'guest', code: code.toUpperCase(), seat: null, cid: uid(), roster: [], links: {} }); }
    function resume(session) { return start(session); }
    function scheduleRetry() { clearTimeout(L.retry); if (S && !isHost() && !(L.conns[0] && L.conns[0].open)) L.retry = setTimeout(connectHost, 3000); }
    function connectHost() { if (!L.peer || L.peer.destroyed || (L.conns[0] && L.conns[0].open)) return; attach(L.peer.connect(roomId(S.code), { reliable: true, serialization: 'json' }), 0); scheduleRetry(); }

    /* ---------- connections ---------- */
    function attach(c, seat) {
      let mySeat = seat;                                  // the seat at the other end of this connection
      const onOpen = () => {
        if (!isHost()) { L.conns[0] = c; rawTo(0, { t: 'hi', cid: S.cid, name: opt.name ? opt.name() : '', have: link(0).lastIn, v: opt.version, hb: 1 }); }
      };
      if (c.open) onOpen(); else c.on('open', onOpen);
      c.on('data', m => {
        if (!m || !m.t) return;
        const key = isHost() ? mySeat : 0;                // 1.1 heartbeat: remember when we last heard from them
        if (key != null) L.seen[key] = Date.now();
        if (m.t === 'ping') { if (key != null) L.hb[key] = 1; return; }
        if (isHost() && m.t === 'hi') {                   // a guest introduces itself → give it a seat (same seat when it comes back)
          let p = S.roster.find(x => x.cid === m.cid);
          if (!p) {
            if (S.roster.length >= max()) { try { c.send({ t: 'full' }); c.close(); } catch (e) {} return; }
            let s = 1; while (S.roster.some(x => x.seat === s)) s++;
            p = { seat: s, cid: m.cid, name: '', online: true, voice: false }; S.roster.push(p); S.roster.sort((a, b) => a.seat - b.seat);
            ev('onJoin', s);
          }
          mySeat = p.seat; p.name = (m.name || '').slice(0, 20); p.online = true; p.pid = c.peer;
          if ((m.have || 0) > link(mySeat).seq) link(mySeat).seq = m.have;   // 1.1: we restored an older session — keep numbering after what they already got
          if (L.conns[mySeat] && L.conns[mySeat] !== c) { try { L.conns[mySeat].close(); } catch (e) {} }
          L.conns[mySeat] = c; L.seen[mySeat] = Date.now(); L.hb[mySeat] = m.hb ? 1 : 0;   // 1.1 phones announce the heartbeat
          rawTo(mySeat, { t: 'hi', seat: mySeat, have: link(mySeat).lastIn, roster: S.roster, v: opt.version, hb: 1 });
          link(mySeat).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(mySeat, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          persist(); broadcastRoster(); setStatus('open'); callEveryone();
          return;
        }
        if (!isHost() && m.t === 'hi') {
          S.seat = m.seat; S.roster = m.roster || []; L.seen[0] = Date.now(); L.hb[0] = m.hb ? 1 : 0;
          if ((m.have || 0) > link(0).seq) link(0).seq = m.have;            // 1.1: same protection on the guest side
          persist();
          link(0).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(0, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          clearTimeout(L.retry); setStatus('open'); ev('onRoster', S.roster); callEveryone(); return;
        }
        if (m.t === 'full') { setStatus('full', 'full'); close(true); return; }
        onData(m, isHost() ? mySeat : 0);
      });
      const gone = () => {
        if (isHost()) { if (mySeat == null || L.conns[mySeat] !== c) return; delete L.conns[mySeat]; const p = rosterEntry(mySeat); if (p) p.online = false; persist(); broadcastRoster(); setStatus(Object.keys(L.conns).length ? 'open' : 'waiting'); }
        else { if (L.conns[0] !== c) return; delete L.conns[0]; setStatus('reconnecting'); scheduleRetry(); }
        stopAudioFrom(mySeat);
      };
      c.on('close', gone); c.on('error', gone);
    }
    function broadcastRoster() { if (!isHost()) return; rawAll({ t: 'roster', roster: S.roster }); ev('onRoster', S.roster); }

    /* ---------- messages ---------- */
    function onData(m, via) {
      if (m.t === 'roster') { S.roster = m.roster; persist(); ev('onRoster', S.roster); callEveryone(); return; }
      if (m.t === 'need') { link(via).out.filter(x => x.seq > m.have).forEach(x => rawTo(via, x)); return; }
      if (m.t === 'emo' || m.t === 'talk' || m.t === 'vm') {
        if (isHost()) rawAll(m, via);                     // relay to the other guests
        if (m.t === 'emo') ev('onEmoji', m.e, m.from);
        else if (m.t === 'talk') { const p = rosterEntry(m.from); if (p) p.talking = m.on; ev('onTalk', m.from, m.on); }
        else gotChunk(m);
        return;
      }
      if (m.t === 'voice') { const p = rosterEntry(m.from); if (p) p.voice = m.on; if (isHost()) { rawAll(m, via); broadcastRoster(); } callEveryone(); return; }
      if (m.t !== 'm') return;
      const lk = link(via);
      if (m.seq <= lk.lastIn) return;
      if (m.seq > lk.lastIn + 1) { rawTo(via, { t: 'need', have: lk.lastIn }); return; }
      lk.lastIn = m.seq; persist();
      if (isHost() && max() > 2 && !m.p) for (const p of S.roster) if (p.seat !== 0 && p.seat !== m.from) seqTo(p.seat, m.d, m.from);
      ev('onMessage', m.d, m.from);
    }
    function seqTo(seat, d, from, priv) {
      const lk = link(seat), m = { t: 'm', seq: ++lk.seq, from, d }; if (priv) m.p = 1;
      lk.out.push(m); if (lk.out.length > 300) lk.out.splice(0, lk.out.length - 300);
      rawTo(seat, m);
    }
    function send(d) {                                    // reliable, ordered, reaches every other player
      if (!S) return;
      if (isHost()) { for (const p of S.roster) if (p.seat !== 0) seqTo(p.seat, d, 0); }
      else seqTo(0, d, S.seat);
      persist();
    }
    function sendTo(seat, d) {                            // private: host → one guest, or guest → host only (not relayed)
      if (!S || seat === S.seat) return;
      if (isHost()) { if (S.roster.some(p => p.seat === seat)) seqTo(seat, d, 0, true); }
      else seqTo(0, d, S.seat, true);
      persist();
    }
    function emoji(e) { if (S) rawAll({ t: 'emo', e, from: S.seat }); }
    const isOpen = () => !!S && (isHost() ? Object.values(L.conns).some(c => c.open) : !!(L.conns[0] && L.conns[0].open));

    /* ---------- voice: push-to-talk / open mic (direct mesh) ---------- */
    async function micOn() {
      if (L.mic) return true;
      try { L.mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
      catch (e) { ev('onMicError', e && e.name); return false; }
      L.mic.getAudioTracks().forEach(t => t.enabled = L.openMic);
      const me = rosterEntry(S.seat); if (me) me.voice = true;
      const m = { t: 'voice', on: true, from: S.seat }; rawAll(m);
      callEveryone(); return true;
    }
    function callEveryone() {                             // each phone with a mic sends its own one-way audio call to every other phone
      if (!L.mic || !L.peer || !S) return;
      for (const p of S.roster) {
        if (p.seat === S.seat || !p.online || !p.pid) continue;
        const c = L.calls[p.seat]; if (c && !c._dead) continue;
        try { const call = L.peer.call(p.pid, L.mic, { metadata: { seat: S.seat } }); L.calls[p.seat] = call; call.on('close', () => { call._dead = true; }); call.on('error', () => { call._dead = true; }); } catch (e) {}
      }
    }
    function onCall(call) {
      call.answer();                                      // receive only — our own audio goes out on our own call
      call.on('stream', st => {
        const seat = call.metadata && call.metadata.seat;
        let a = L.audio[seat]; if (!a) { a = L.audio[seat] = document.createElement('audio'); a.autoplay = true; a.setAttribute('playsinline', ''); a.style.display = 'none'; document.body.appendChild(a); }
        a.srcObject = st; const p = a.play(); if (p && p.catch) p.catch(() => ev('onAudioBlocked'));
      });
    }
    function stopAudioFrom(seat) { const a = L.audio[seat]; if (a) { a.srcObject = null; a.remove(); delete L.audio[seat]; } const c = L.calls[seat]; if (c) { try { c.close(); } catch (e) {} delete L.calls[seat]; } }
    async function talk(on) {
      if (on && !(await micOn())) return false;
      if (!L.mic) return false;
      L.talking = on || L.openMic; L.mic.getAudioTracks().forEach(t => t.enabled = L.talking);
      rawAll({ t: 'talk', on: L.talking, from: S.seat }); return true;
    }
    async function setOpenMic(on) { L.openMic = on; if (on && !(await micOn())) { L.openMic = false; return false; } return talk(on); }

    /* ---------- voice messages ---------- */
    async function recStart(maxSec) {
      if (L.rec || !(await micOn())) return false;
      const track = L.mic.getAudioTracks()[0].clone(); track.enabled = true;
      const st = new MediaStream([track]), mime = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
      let r; try { r = new MediaRecorder(st, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : undefined); } catch (e) { ev('onMicError', 'rec'); return false; }
      const parts = [], t0 = Date.now();
      L.rec = { r, track, t0, timer: setTimeout(() => recStop(), (maxSec || 20) * 1000) };
      r.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
      r.onstop = async () => {
        track.stop();
        const dur = Math.round((Date.now() - t0) / 100) / 10, blob = new Blob(parts, { type: r.mimeType || mime || 'audio/webm' });
        if (L.rec && L.rec.cancel || dur < .4 || !blob.size) { L.rec = null; ev('onRecState', false); return; }
        L.rec = null; ev('onRecState', false);
        const data = b64(await blob.arrayBuffer()), id = uid(), CH = 12000, n = Math.ceil(data.length / CH);
        for (let i = 0; i < n; i++) rawAll({ t: 'vm', id, i, n, dur, mime: blob.type, from: S.seat, data: data.slice(i * CH, (i + 1) * CH) });
        ev('onVoiceMsg', URL.createObjectURL(blob), dur, S.seat, true);
      };
      r.start(); ev('onRecState', true, t0); return true;
    }
    function recStop(cancel) { if (!L.rec) return; clearTimeout(L.rec.timer); L.rec.cancel = !!cancel; try { L.rec.r.stop(); } catch (e) {} }
    function gotChunk(m) {
      const c = L.chunks[m.id] || (L.chunks[m.id] = { parts: [], got: 0, t: Date.now() });
      if (c.parts[m.i] == null) { c.parts[m.i] = m.data; c.got++; }
      if (c.got === m.n) { delete L.chunks[m.id]; const blob = new Blob([unb64(c.parts.join(''))], { type: m.mime || 'audio/webm' }); ev('onVoiceMsg', URL.createObjectURL(blob), m.dur, m.from, false); }
      for (const k in L.chunks) if (Date.now() - L.chunks[k].t > 60000) delete L.chunks[k];
    }

    /* ---------- 1.1 heartbeat ----------
       A phone that closes the app or loses signal often never fires 'close'. Every 3 s we ping
       everyone; a peer that pings (1.1+) but has been silent for 10 s is treated as gone.
       Peers on 1.0 never ping, so they are never dropped by mistake. */
    function beat() {
      if (!S) return;
      const now = Date.now();
      for (const k in L.conns) {
        const s = +k; rawTo(s, { t: 'ping' });
        if (!L.hb[s] || now - (L.seen[s] || now) < 10000) continue;
        L.hb[s] = 0; const c = L.conns[s]; delete L.conns[s]; try { c.close(); } catch (e) {}
        stopAudioFrom(s);
        if (isHost()) { const p = rosterEntry(s); if (p) p.online = false; persist(); broadcastRoster(); setStatus(Object.keys(L.conns).length ? 'open' : 'waiting'); }
        else { setStatus('reconnecting'); scheduleRetry(); }
      }
    }

    /* ---------- closing ---------- */
    function close(keepSession) {
      clearTimeout(L.retry); clearInterval(L.hbT); L.hbT = null;
      Object.keys(L.audio).forEach(s => stopAudioFrom(+s));
      for (const s in L.conns) { try { L.conns[s].close(); } catch (e) {} }
      L.conns = {};
      if (L.mic) { L.mic.getTracks().forEach(t => t.stop()); L.mic = null; }
      L.calls = {}; L.talking = false;
      try { if (L.peer) L.peer.destroy(); } catch (e) {}
      L.peer = null; if (!keepSession) S = null; setStatus('off');
    }

    return {
      host, join, resume, close, send, sendTo, emoji, isOpen, talk, setOpenMic, recStart, recStop,
      get status() { return L.status; }, get error() { return L.lastErr; }, get session() { return S; },
      get seat() { return S ? S.seat : null; }, get roster() { return S ? S.roster : []; },
      get micReady() { return !!L.mic; }, get talking() { return L.talking; }, get openMic() { return L.openMic; }, get recording() { return !!L.rec; },
      inviteURL: () => location.origin + location.pathname + '?join=' + (S ? S.code : ''),
      _L: L
    };
  }
  return { create, genCode, loadPeer };
})();
</script>
<script>/* SnakeNest engine — pure & deterministic (seeded RNG, fixed step 1/60). Runs in browser and Node. */
(function (root) {
'use strict';
var SEA = 0, NEU = 1; // land owned by snake id k is 1+k (k=1 → 2, k=2 → 3)
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

    var a = Math.atan2(pts[i + 1][1] - pts[i][1], pts[i + 1][0] - pts[i][0]) + Math.PI / 2, sz = cs * Math.min(1, .62 + .1 * i);
    x.save(); x.translate(pts[i][0], pts[i][1]); x.rotate(a);
    if (i === 0) x.drawImage(im.tail, -cs / 2, -cs * .35, cs, cs); else x.drawImage(im.body, -sz / 2, -sz / 2, sz, sz);
    x.restore();
  }
  var h = pts[pts.length - 1], p2 = pts[pts.length - 2], ha = Math.atan2(h[1] - p2[1], h[0] - p2[0]) + Math.PI / 2, hs = cs * 1.9;
  x.save(); x.translate(h[0], h[1]); x.rotate(ha); x.drawImage(im.head, -hs / 2, -hs * .78, hs, hs); x.restore();
}

function exportBackup() {
  var data = JSON.stringify({ app: 'snakenest', version: APP_VERSION, user: D.set.name || '', date: new Date().toISOString(), data: D }, null, 1);
  var blob = new Blob([data], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'snakenest-backup-' + today() + '.json'; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); snack(T('exported'));
}
$('fileIn').addEventListener('change', function () {
  var f = this.files[0]; this.value = ''; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try { var j = JSON.parse(rd.result); if (j.app !== 'snakenest' || !j.data || j.data.v !== 1) throw 0;
      confirmBox(T('import_c'), function () { D = merge(defData(), j.data); save(); applyLang(); applyTheme(); renderSettings(); snack(T('import_ok')); });
    } catch (e) { snack(T('import_bad')); }
  };
  rd.readAsText(f);
});

function tutorial() {
  var i = 1, ill = ['🐍', '👆', '🏝️', '🐡🦀', '⚔️'];
  var m = modal('', { cls: 'tut', dismiss: false, onClose: function () { D.tut = true; save(); } });
  function draw() {
    var md = m.el.querySelector('.md'), dots = '';
    for (var k = 1; k <= 5; k++) dots += '<i class="' + (k === i ? 'on' : '') + '"></i>';
    md.innerHTML = '<div class="ill">' + ill[i - 1] + '</div><h3>' + T('tut' + i + 't') + '</h3><p style="line-height:1.6">' + T('tut' + i + 'b') + '</p><div class="dots">' + dots + '</div><div class="btns"><button class="btn pri" id="tN">' + (i < 5 ? T('nextb') : T('done')) + '</button>' + (i < 5 ? '<button class="btn" id="tS">' + T('skip') + '</button>' : '') + '</div>';
    md.querySelector('#tN').onclick = function () { if (i < 5) { i++; draw(); } else closeModal(m); };
    var sk = md.querySelector('#tS'); if (sk) sk.onclick = function () { closeModal(m); };
  }
  draw();
}
